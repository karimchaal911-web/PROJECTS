<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b09" />
    <link rel="icon" href="./assets/brand/ocp.png" />
    <meta name="description" content="A continuous cinematic 3D soutenance about soluble MAP dryer digitalization, advisory soft sensing, process novelty, and operator supervision." />
    <title>Soluble MAP / Dryer Digitalization Soutenance</title>
    <script type="module" crossorigin src="/assets/index-CCpyQxc5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-L6JrNToR.css">
  </head>
  <body>
    <div id="app">
      <div id="world"></div>
      <div class="light-bloom" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="travel-sheen" id="travel-sheen" aria-hidden="true"></div>

      <header class="chrome" aria-label="Presentation context">
        <div class="chrome__brand">
          <img src="./assets/brand/ocp.png" alt="OCP" />
          <span>SOLUBLE MAP / DRYER DIGITALIZATION</span>
        </div>
        <div class="chrome__meta">
          <span class="mode" id="mode-label">AUTO TOUR / CINEMATIC</span>
          <span id="scene-number">01 / 15</span>
        </div>
      </header>

      <main class="stage" aria-live="polite">
        <article class="copy left-bottom wide" id="copy">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
          <div class="detail" id="detail"></div>
        </article>
        <div class="scene-labels" id="scene-labels" aria-hidden="true"></div>
      </main>

      <aside class="presenter" id="presenter" hidden>
        <div>
          <span>NEXT CAMERA DESTINATION</span>
          <strong id="presenter-next"></strong>
        </div>
        <p id="presenter-cue"></p>
      </aside>

      <aside class="fallback" id="fallback" hidden role="alert">
        <strong>3D rendering paused.</strong>
        <span>Press S to restart in safe mode, or open the PowerPoint/PDF fallback.</span>
      </aside>

      <footer class="controls" id="controls">
        <div class="progress" aria-label="Tour progress"><i id="progress"></i></div>
        <div class="transport">
          <button id="previous" type="button" aria-label="Previous scene">&#8592;</button>
          <button id="play-pause" class="play" type="button" aria-label="Pause cinematic tour">II</button>
          <button id="next" type="button" aria-label="Next scene">&#8594;</button>
        </div>
        <span class="controls__hint">SPACE PLAY/PAUSE &nbsp; ARROWS Q&amp;A &nbsp; P NOTES &nbsp; S SAFE &nbsp; F FULLSCREEN</span>
      </footer>

      <noscript>This presentation requires JavaScript. Open the PowerPoint or PDF fallback in the package root.</noscript>
    </div>
  </body>
</html>
